name: CI

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install .[dev]
      - name: Lint
        run: |
          flake8 src tests
      - name: Type check
        run: |
          mypy src
      - name: Build
        run: |
          python -m build
      - name: Test
        run: |
          pytest -q
