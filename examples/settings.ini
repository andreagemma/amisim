[GENERAL]
# file name of coefficients for the model
SRC_COEFS = 
# file name of conversion table for the model
SRC_CONV_TBL = 
# debug mode used for development
DEBUG = False
# default CRS if not found in the input data
CRS = EPSG:4326
# default CRS for calculations and internal use
CRS_CALC = EPSG:6875
TZ_LOCAL = Europe/Rome
TZ_CALC = UTC
# check input data consistency as Graph, Zones, OD matrices, ecc.  (default False)
CHECK_INPUT = False
# Random seed
RANDOM_SEED = 42

[OUTPUT]
# output aggregation interval in minutes
OUTPUT_AGG_INT = 15
# output state compression method
# blosclz, lz4, lz4hc, snappy, zlib, zstd, gzip, bz2, zip, lzma or None (lz4 default)
OUTPUT_STATE_COMPRESSION = snappy
# compression level for output state (1-9) (default 5)
OUTPUT_STATE_LEVEL_COMPRESSION = 5
# output of individual results
OUTPUT_IND_RES = True
# percentage of vehicles to monitor for individual results
MONITORED_VEH = 30

[WEB_SERVER]
# web server host address
WEB_SERVER_HOST = 0.0.0.0
# web server port
WEB_SERVER_PORT = 5000
# web server debug mode
WEB_SERVER_DEBUG = False

[DATABASE]
# internal database connection string (tracking execution, logging, etc.)
#DATABASE_URL = postgresql+psycopg2://postgres:lDvdc15dcd5@192.168.133.80:5432/m4i
DATABASE_URL = sqlite:///model4italy.db

[DATABASE_SETTINGS]
# database for the model settings
DB_SETTINGS_USE = False
DB_SETTINGS_URL = sqlite:///settings.db
DB_SETTINGS_TABLE_NAME = settings
DB_SETTINGS_QUERY = SELECT value FROM settings WHERE name = :name

[LOGGING]
# logging configuration
LOG_USE = True
# log name
LOG_NAME = m4i
# log level
LOG_LEVEL = DEBUG
# log on internal database
LOG_ON_DATABASE = True
# log on console
LOG_ON_CONSOLE = True
# log on file
LOG_ON_FILE = True
# log if the execution is tracked
LOG_EXECUTION_FORMAT = %%(asctime)s | %%(last_elapsed).2f/%%(elapsed).2fs | %%(levelname)s | %%(name)s | %%(execution_id)s | %%(message)s
# log format if execution is not tracked
LOG_FORMAT = %%(asctime)s | %%(levelname)s | %%(name)s | %%(message)s
# log directory for file logging
LOG_DIR = log

[IPC]
# inter-process communication settings
IPC_USE = True
# IPC bucket name. This is used to realize unique names for the IPC channels and variables: es: foo -> bucket:foo.
IPC_BUCKET = m4i
# IPC backend to use: local for local IPC, redis for redis IPC
IPC_BACKEND = local 
# address of the IPC server (default localhost)
IPC_HOST = localhost 
# redis server port or free port for local
IPC_PORT = 16379 
# redis db number. not used for local
IPC_DB = 0 
# compression method for data tranfer # blosclz, lz4, lz4hc, snappy, zlib, zstd, gzip, bz2, zip, lzma or None (lz4 default)
# the data are serialized as pickle with dill library and compressed
IPC_COMPRESSION = lz4 
# compression level for data tranfer (1-9) (default 5)
IPC_COMPRESSION_LEVEL = 5 

[PARALLEL]
# parallel execution settings
PARALLEL_USE = True
# number of parallel processes n=0 -> max available, n<0 ->number of available cores - n, n>0 -> max(number of corse and n)
PARALLEL_NUMCPUS = 56
# ray or None
PARALLEL_ENGINE = joblib
# address of the cluster (default auto) (auto,local,or ip address ray://ip:port)
#PARALLEL_CLUSTER_ADDRESS = auto
PARALLEL_CLUSTER_ADDRESS = local


[SIMULATOR]
# simulator settings
# simulation step in seconds
SIMU_STEP = 6
# car length in meters
CAR_LENGTH = 5
# minimum speed in km/h
MIN_SPEED = 4
# aggregation interval in minutes
# AGG_INT = 5 # Sostituito da OUTPUT_AGG_INT
# simulation parameters
LT1 = 0
LT2 = 0

[ASSIGNMENT]
# assignment settings
# default equivalent class factor for the assignment
CLASS_EQ_FACT = {'c': 1, 'h': 2}
# maximum number of iterations for the assignment
MSA_MAX_ITE = 3
# relative gap for the assignment
MSA_RGAP = 0.01
# maximum number of paths for the MSA algorithm
MSA_K = 3
# maximum timeslice for the MSA algorithm in seconds
MSA_MAX_TIMESLICE = 1440
# maximum number of CPUs for the MSA algorithm (PARALLEL_NUMCPUS is maximum number of CPUs available)
# n=0 -> max available, n<0 ->number of available cores - n, n>0 -> max(number of corse and n)
MSA_SPP_NUMCPUS = 0
# MSA balancing factor to evaluate 1/k shifted flows
# <= 0 indicates that the balance of the MSA starts with k=MSA_K, if >0 indicates that k=indicated value
MSA_K_BALANCING = -1
# Time interval for the assignment in minutes (default 15). OD matrix and paths are updated every DELTA_T minutes.
DELTA_T = 15
# Save at the end /laod at begin the paths in assignment algorithm (default: false).
SAVE_PATHS = False
LOAD_PATHS = False
# Save at the end/laod at begin the graph in assignment algorithm (default: false).
SAVE_GRAPH = False
LOAD_GRAPH = False
# Simulation preload period/Post simulation period (default: 0).
MSA_PRELOAD = 0
MSA_POSTLOAD = 0
# 
USE_OBSERVED_PATHS = True



[OD_ESIMATION]
OD_ESTIMATION_WHISKERS = 60
OD_ESTIMATION_MAX_ITE = 2
